name: Release - Publish

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A re-run after a failed CocoaPods push finds the release already created.
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
            exit 0
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes

      - name: Publish to CocoaPods
        id: trunk-push
        # CocoaPods trunk is going read-only; the GitHub release and SPM are already done.
        continue-on-error: true
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push RoktContracts.podspec --allow-warnings

      - name: Warn when the trunk push failed
        if: steps.trunk-push.outcome == 'failure'
        run: |
          echo "::warning::The CocoaPods trunk push failed. The GitHub release and SPM are not affected. Check the log above for the cause, and re-run this job once it is fixed or trunk accepts pushes again."
          {
            echo "### CocoaPods trunk push failed"
            echo "The GitHub release and SPM are not affected. Check the job log for the cause."
          } >> "$GITHUB_STEP_SUMMARY"
