name: Pull Request

permissions:
  contents: read
  pull-requests: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: all

  unit-test:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --enable-code-coverage

      - name: Export coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          xcrun llvm-cov export \
            "${BIN_PATH}/RoktContractsPackageTests.xctest" \
            -instr-profile "$(find .build -name 'default.profdata' -type f)" \
            -format lcov > coverage.lcov 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false

  podspec-lint:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint podspec
        run: pod lib lint RoktContracts.podspec --allow-warnings --verbose

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    name: Notify GChat
    needs: [unit-test, podspec-lint]
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_MOBILE_INTEGRATION_CHANNEL_WEBHOOK }}
